name: ssh_terminal_ja
description: "完全日本語対応のAndroid向けSSHモバイルターミナル。"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cryptography: ^2.9.0
  dartssh2:
    path: third_party/dartssh2
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  flutter_secure_storage: ^10.3.1
  ftpconnect: ^2.0.10
  go_router: ^17.4.0
  intl: ^0.20.2
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  xterm:
    path: third_party/xterm

dev_dependencies:
  build_runner: 2.15.1
  drift_dev: 2.34.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqlite3: ^3.5.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/fonts/LICENSE-Koruri.txt
    - assets/fonts/LICENSE-Mejiro.txt
  fonts:
    - family: CascadiaMono
      fonts:
        - asset: assets/fonts/CascadiaMono.ttf
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP-VF.ttf
    - family: Koruri
      fonts:
        - asset: assets/fonts/Koruri-Regular.ttf
          weight: 400
        - asset: assets/fonts/Koruri-Bold.ttf
          weight: 700
    - family: Mejiro
      fonts:
        - asset: assets/fonts/Mejiro-Regular.ttf
          weight: 400
        - asset: assets/fonts/Mejiro-Bold.ttf
          weight: 700
