name: ssh_terminal_ja
description: "完全日本語対応のAndroid向けSSHモバイルターミナル。"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  dartssh2:
    path: third_party/dartssh2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  ftpconnect: ^2.0.10
  go_router: ^17.4.0
  intl: ^0.20.2
  xterm:
    path: third_party/xterm

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  fonts:
    - family: CascadiaMono
      fonts:
        - asset: assets/fonts/CascadiaMono.ttf
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP-VF.ttf
