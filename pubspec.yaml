name: termethis
description: "日本語入力に対応したAndroid向けSSH・SFTPモバイルターミナル。"
publish_to: 'none'
version: 0.8.0-alpha+8

environment:
  sdk: ^3.12.2

dependencies:
  cryptography: ^2.9.0
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_alacritty: ^2.4.0
  flutter_riverpod: ^3.4.2
  flutter_rust_bridge: 2.12.0
  flutter_secure_storage: ^10.3.1
  ftpconnect: ^2.0.10
  go_router: ^17.4.0
  intl: ^0.20.2
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  termethis_core:
    path: rust_builder
  webview_flutter: ^4.14.1
  xterm:
    path: third_party/xterm

dev_dependencies:
  build_runner: 2.15.1
  drift_dev: 2.34.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqlite3: ^3.5.1

dependency_overrides:
  # rust_lib_flutter_alacritty 0.2.2のCargokitをGradle 9 APIへ適合させたもの。
  rust_lib_flutter_alacritty:
    path: third_party/rust_lib_flutter_alacritty

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/fonts/LICENSE-CascadiaCode.txt
    - assets/fonts/LICENSE-NotoSansJP.txt
    - assets/fonts/LICENSE-Koruri.txt
    - assets/fonts/LICENSE-Mejiro.txt
    - assets/fonts/LICENSE-Roboto.txt
    - assets/fonts/LICENSE-Moralerspace.txt
    - assets/fonts/LICENSE-SourceCodePro.txt
    - assets/fonts/LICENSE-JetBrainsMono.txt
    - assets/fonts/LICENSE-NerdFontsSymbols.txt
    - assets/licenses/LICENSE-IronRDP-APACHE.txt
    - assets/licenses/LICENSE-IronRDP-MIT.txt
    - assets/licenses/LICENSE-Picky-APACHE.txt
    - assets/licenses/LICENSE-Picky-MIT.txt
    - assets/licenses/LICENSE-wgpu-APACHE.txt
    - assets/licenses/LICENSE-wgpu-MIT.txt
    - assets/licenses/LICENSE-raw-window-handle-APACHE.txt
    - assets/licenses/LICENSE-raw-window-handle-MIT.txt
    - assets/licenses/LICENSE-raw-window-handle-ZLIB.txt
    - assets/licenses/LICENSE-jni-APACHE.txt
    - assets/licenses/LICENSE-jni-MIT.txt
    - assets/licenses/LICENSE-pollster-APACHE.txt
    - assets/licenses/LICENSE-pollster-MIT.txt
    - assets/licenses/LICENSE-anyhow-APACHE.txt
    - assets/licenses/LICENSE-anyhow-MIT.txt
    - assets/licenses/LICENSE-bytes.txt
    - assets/licenses/LICENSE-dashmap.txt
    - assets/licenses/LICENSE-flutter-rust-bridge.txt
    - assets/licenses/LICENSE-ndk-sys-APACHE.txt
    - assets/licenses/LICENSE-once-cell-APACHE.txt
    - assets/licenses/LICENSE-once-cell-MIT.txt
    - assets/licenses/LICENSE-russh-APACHE.txt
    - assets/licenses/LICENSE-russh-sftp.txt
    - assets/licenses/LICENSE-tokio.txt
    - assets/licenses/LICENSE-Shizuku-API.txt
    - third_party/xterm/LICENSE
    - third_party/termlib/LICENSE
    - third_party/termlib/lib/src/main/cpp/libvterm/LICENSE
    - assets/web_terminal/
  fonts:
    - family: CascadiaMono
      fonts:
        - asset: assets/fonts/CascadiaMono.ttf
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP-VF.ttf
    - family: Koruri
      fonts:
        - asset: assets/fonts/Koruri-Regular.ttf
          weight: 400
        - asset: assets/fonts/Koruri-Bold.ttf
          weight: 700
    - family: Mejiro
      fonts:
        - asset: assets/fonts/Mejiro-Regular.ttf
          weight: 400
        - asset: assets/fonts/Mejiro-Bold.ttf
          weight: 700
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-VF.ttf
    - family: Moralerspace
      fonts:
        - asset: assets/fonts/Moralerspace-Regular.ttf
    - family: SourceCodePro
      fonts:
        - asset: assets/fonts/SourceCodePro-VF.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-VF.ttf
    - family: NerdSymbolsMono
      fonts:
        - asset: assets/fonts/SymbolsNerdFontMono-Regular.ttf
