<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:">
    <link rel="stylesheet" href="terminal.css">
    <style>
      @font-face {
        font-family: CascadiaMono;
        src: url('../fonts/CascadiaMono.ttf') format('truetype');
        font-display: block;
      }
      @font-face {
        font-family: Mejiro;
        src: url('../fonts/Mejiro-Regular.ttf') format('truetype');
        font-display: block;
      }
      html, body, #terminal {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
      }
      #terminal .xterm {
        height: 100%;
        padding: 6px 4px;
        box-sizing: border-box;
      }
      #terminal .xterm-viewport::-webkit-scrollbar {
        width: 5px;
      }
      #terminal .xterm-viewport::-webkit-scrollbar-thumb {
        background: #4b4b4b;
        border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <div id="terminal" aria-label="Termethis SSHターミナル"></div>
    <script src="terminal.js"></script>
  </body>
</html>
