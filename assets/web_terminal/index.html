<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:">
    <link rel="stylesheet" href="terminal.css">
    <style>
      @font-face {
        font-family: CascadiaMono;
        src: url('../fonts/CascadiaMono.ttf') format('truetype');
        font-display: block;
      }
      @font-face {
        font-family: NotoSansJP;
        src: url('../fonts/NotoSansJP-VF.ttf') format('truetype');
        font-display: block;
      }
      @font-face {
        font-family: Koruri;
        src: url('../fonts/Koruri-Regular.ttf') format('truetype');
        font-display: block;
      }
      @font-face {
        font-family: Mejiro;
        src: url('../fonts/Mejiro-Regular.ttf') format('truetype');
        font-display: block;
      }
      @font-face {
        font-family: Roboto;
        src: url('../fonts/Roboto-VF.ttf') format('truetype');
        font-display: block;
        font-style: normal;
        font-weight: 100 900;
        font-stretch: 75% 100%;
      }
      @font-face {
        font-family: Moralerspace;
        src: url('../fonts/Moralerspace-Regular.ttf') format('truetype');
        font-display: block;
      }
      @font-face {
        font-family: SourceCodePro;
        src: url('../fonts/SourceCodePro-VF.ttf') format('truetype');
        font-display: block;
        font-style: normal;
        font-weight: 200 900;
      }
      @font-face {
        font-family: JetBrainsMono;
        src: url('../fonts/JetBrainsMono-VF.ttf') format('truetype');
        font-display: block;
        font-style: normal;
        font-weight: 100 800;
      }
      @font-face {
        font-family: NerdSymbolsMono;
        src: url('../fonts/SymbolsNerdFontMono-Regular.ttf') format('truetype');
        font-display: block;
      }
      html, body, #terminal-scroll {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
      }
      #terminal-scroll {
        overflow-x: auto;
        overflow-y: hidden;
        overscroll-behavior-x: contain;
        scrollbar-color: #4b4b4b transparent;
        scrollbar-width: thin;
      }
      #terminal-scroll::-webkit-scrollbar {
        height: 5px;
      }
      #terminal-scroll::-webkit-scrollbar-thumb {
        background: #4b4b4b;
        border-radius: 3px;
      }
      #terminal {
        width: 100%;
        min-width: 100%;
        height: 100%;
        background: #000;
      }
      #terminal .xterm {
        height: 100%;
        padding: 6px 4px;
        box-sizing: border-box;
        font-kerning: none;
        font-synthesis: none;
        font-variant-ligatures: none;
        text-rendering: geometricPrecision;
        -webkit-font-smoothing: antialiased;
      }
      #terminal .xterm-viewport::-webkit-scrollbar {
        width: 5px;
      }
      #terminal .xterm-viewport::-webkit-scrollbar-thumb {
        background: #4b4b4b;
        border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <div id="terminal-scroll">
      <div id="terminal" aria-label="Termethis SSHターミナル"></div>
    </div>
    <script src="terminal.js"></script>
  </body>
</html>
