[package]
name = "termethis_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
anyhow = "1.0"
bytes = "1.10"
dashmap = "6.1"
flutter_rust_bridge = "=2.12.0"
ironrdp = { version = "0.17.0", default-features = false, features = ["client", "input", "pdu", "rustls"] }
once_cell = "1.21"
russh = { version = "0.53.0", default-features = false, features = ["ring"] }
russh-sftp = "2.4.0"
tokio = { version = "1.47", features = ["io-util", "net", "rt", "sync", "time"] }
zeroize = "1.8"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-sys = "0.6"
pollster = "0.4"
raw-window-handle = "0.6"
wgpu = { version = "28.0", default-features = false, features = ["vulkan", "wgsl"] }

[patch.crates-io]
picky = { path = "../third_party/picky" }
ironrdp-client = { path = "../third_party/ironrdp-client" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
