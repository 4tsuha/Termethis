[package]
name = "vbterminal_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
anyhow = "1.0"
bytes = "1.10"
dashmap = "6.1"
flutter_rust_bridge = "=2.12.0"
once_cell = "1.21"
russh = { version = "0.62.5", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "2.4.0"
tokio = { version = "1.47", features = ["sync", "time"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
